name: Node.js Application CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # Stage 1: Build & Test
  # =========================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        working-directory: application
        run: npm ci

      - name: Run tests
        working-directory: application
        run: npm test -- --watchAll=false
        continue-on-error: true

      - name: Build application
        working-directory: application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: application/build/


  # =========================
  # Stage 2: Deploy
  # =========================
  deploy:
    name: Deploy Application to VM
    needs: build

    # IMPORTANT:
    # This runner must have network access to the VM private IP.
    runs-on: self-hosted

    # Deploy only after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # Download build artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: build

      # Setup SSH key
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/azure_vm_key

          chmod 600 ~/.ssh/azure_vm_key

          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      # Test connection to VM
      - name: Test VM connection
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            -o StrictHostKeyChecking=no \
            azureuser@${{ secrets.VM_HOST }} \
            "echo 'VM connection successful'"

      # Prepare deployment directory
      - name: Prepare VM
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo mkdir -p /var/www/reacttodo && \
             sudo rm -rf /var/www/reacttodo/*"

      # Copy build to VM
      - name: Copy application
        run: |
          scp \
            -i ~/.ssh/azure_vm_key \
            -r build/* \
            azureuser@${{ secrets.VM_HOST }}:/tmp/

      # Deploy files
      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo cp -r /tmp/* /var/www/reacttodo/ && \
             sudo chown -R www-data:www-data /var/www/reacttodo && \
             sudo systemctl reload nginx"

      # Verify deployment
      - name: Verify Nginx
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo nginx -t && sudo systemctl is-active nginx"

      - name: Deployment completed
        run: |
          echo "Application deployed successfully."
