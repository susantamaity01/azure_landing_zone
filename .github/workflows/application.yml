name: React Application CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # Stage 1: Build & Test
  # ==========================================
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        working-directory: application
        run: npm ci

      # ----------------------------------------
      # Fix CRA Babel dependency
      # ----------------------------------------
      - name: Install Babel compatibility dependency
        working-directory: application
        run: npm install --save-dev @babel/plugin-proposal-private-property-in-object

      # ----------------------------------------
      # Run tests
      # ----------------------------------------
      - name: Run tests
        working-directory: application
        run: npm test -- --watchAll=false
        continue-on-error: true

      # ----------------------------------------
      # Build React application
      # ----------------------------------------
      - name: Build application
        working-directory: application
        env:
          CI: true
        run: npm run build

      # ----------------------------------------
      # Upload production build
      # ----------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: application/build/


  # ==========================================
  # Stage 2: Deploy to Azure VM
  # ==========================================
  deploy:
    name: Deploy React Application to Azure VM
    needs: build

    # Self-hosted runner must have
    # private network access to the VM
    runs-on: ubuntu-latest

    # Deploy only after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # ----------------------------------------
      # Download build artifact
      # ----------------------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      # ----------------------------------------
      # Setup SSH key
      # ----------------------------------------
      - name: Setup SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/azure_vm_key

          chmod 600 ~/.ssh/azure_vm_key

      # ----------------------------------------
      # Add VM to known hosts
      # ----------------------------------------
      - name: Add VM to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.VM_HOST }}" \
            >> ~/.ssh/known_hosts

      # ----------------------------------------
      # Test VM connection
      # ----------------------------------------
      - name: Test VM connection
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            -o StrictHostKeyChecking=no \
            azureuser@${{ secrets.VM_HOST }} \
            "echo 'VM connection successful'"

      # ----------------------------------------
      # Prepare deployment directory
      # ----------------------------------------
      - name: Prepare deployment directory
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo mkdir -p /var/www/reacttodo && \
             sudo rm -rf /var/www/reacttodo/* && \
             rm -rf /tmp/reacttodo && \
             mkdir -p /tmp/reacttodo"

      # ----------------------------------------
      # Copy React build to VM
      # ----------------------------------------
      - name: Copy React build
        run: |
          scp \
            -i ~/.ssh/azure_vm_key \
            -r build/* \
            azureuser@${{ secrets.VM_HOST }}:/tmp/reacttodo/

      # ----------------------------------------
      # Deploy files to Nginx directory
      # ----------------------------------------
      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo cp -r /tmp/reacttodo/* /var/www/reacttodo/ && \
             sudo chown -R www-data:www-data /var/www/reacttodo && \
             sudo systemctl reload nginx"

      # ----------------------------------------
      # Verify deployment
      # ----------------------------------------
      - name: Verify Nginx
        run: |
          ssh \
            -i ~/.ssh/azure_vm_key \
            azureuser@${{ secrets.VM_HOST }} \
            "sudo nginx -t && \
             sudo systemctl is-active nginx"

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "Application deployed successfully!"
          echo "======================================"
