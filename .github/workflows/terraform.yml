name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

jobs:

  # =========================
  # Stage 1: Scan & Plan
  # =========================
  scan-and-plan:
    name: Scan and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: latest

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environments/UAT
        run: terraform init

      - name: Terraform Validate
        working-directory: Environments/UAT
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environments/UAT
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environments/UAT/tfplan


  # =========================
  # Stage 2: Deploy
  # =========================
  deploy:
    name: Deploy
    needs: scan-and-plan
    runs-on: ubuntu-latest
    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environments/UAT
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: Environments/UAT

      - name: Terraform Apply
        working-directory: Environments/UAT
        run: terraform apply -auto-approve tfplan 
